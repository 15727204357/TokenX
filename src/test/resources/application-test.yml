spring:
  application:
    name: tokenx

  # Local, git-ignored credentials file supplies only spring.datasource.password.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tokenx_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${TOKENX_DB_USERNAME:tokenx}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 4
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Tests must fail loudly instead of silently migrating the wrong database.
    clean-disabled: true

tokenx:
  order:
    timeout:
      # No background trigger in tests: a scheduler thread could close the very rows a test is
      # about to assert on, at a moment the test does not control. The scan itself is fully
      # exercised by calling OrderTimeoutService directly.
      enabled: false

logging:
  level:
    root: warn
    com.tokenx: info
    org.flywaydb: info

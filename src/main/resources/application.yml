spring:
  application:
    name: tokenx

  jackson:
    deserialization:
      # Jackson truncates a JSON float to an int/long by default (123.5 -> 123). Every integer field
      # in this API is an identifier or an amount in minor units, so a fraction is a client mistake
      # that must be refused, not silently rounded into a different value: `{"packageId": 123.5}`
      # would otherwise buy package 123. Turning the coercion off makes such a body a 400.
      # Contract: see docs/PROJECT_SPEC.md §7 (`packageId` is a positive integer);
      # docs/DATABASE_DESIGN.md §4.2 (no float/double for money or ids).
      accept-float-as-int: false

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tokenx?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${TOKENX_DB_USERNAME:tokenx}
    # Never put a real password here: use application-local.yml (git-ignored) or the env var.
    password: ${TOKENX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing, unmanaged database must never be baselined silently.
    baseline-on-migrate: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Persist UserRole/UserStatus as their numeric code, not as the enum name.
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto

tokenx:
  auth:
    jwt:
      # No default on purpose: supply TOKENX_JWT_SECRET, or put the value in the git-ignored
      # application-local.yml. The application refuses to start with a shorter key.
      secret: ${TOKENX_JWT_SECRET:}
      # Already-issued tokens stay valid until they expire; there is no revocation list in V1.
      ttl: ${TOKENX_JWT_TTL:1h}

  order:
    # How long a created order stays payable. Read once per creation and frozen into expires_at, so
    # changing it only affects new orders. Validated at startup: positive and at most 24h.
    payment-timeout: ${TOKENX_ORDER_PAYMENT_TIMEOUT:15m}

    # The scan that closes orders whose deadline passed unpaid. Production runs it; it can be
    # switched off for a maintenance window or for tests that drive the scan themselves.
    timeout:
      enabled: ${TOKENX_ORDER_TIMEOUT_ENABLED:true}
      # Delay between two runs, measured from the end of the previous one. Must be positive.
      interval: ${TOKENX_ORDER_TIMEOUT_INTERVAL:30s}
      # Orders one run may close. Bounded on purpose: each order is its own transaction, and an
      # unbounded batch would hold locks for an unbounded time. Must be 1..1000.
      max-orders-per-run: ${TOKENX_ORDER_TIMEOUT_MAX_ORDERS_PER_RUN:100}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info

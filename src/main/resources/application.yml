spring:
  application:
    name: tokenx

  jackson:
    deserialization:
      # Jackson truncates a JSON float to an int/long by default (123.5 -> 123). Every integer field
      # in this API is an identifier or an amount in minor units, so a fraction is a client mistake
      # that must be refused, not silently rounded into a different value: `{"packageId": 123.5}`
      # would otherwise buy package 123. Turning the coercion off makes such a body a 400.
      # Contract: see docs/PROJECT_SPEC.md §7 (`packageId` is a positive integer);
      # docs/DATABASE_DESIGN.md §4.2 (no float/double for money or ids).
      accept-float-as-int: false

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tokenx?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${TOKENX_DB_USERNAME:tokenx}
    # Never put a real password here: use application-local.yml (git-ignored) or the env var.
    password: ${TOKENX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing, unmanaged database must never be baselined silently.
    baseline-on-migrate: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: ${TOKENX_ACTIVITY_CACHE_REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${TOKENX_ACTIVITY_CACHE_REDIS_COMMAND_TIMEOUT:500ms}

  kafka:
    bootstrap-servers: ${TOKENX_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      fail-fast: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 2000
        buffer.memory: 33554432
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 25
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: 1
      auto-startup: ${TOKENX_KAFKA_LISTENER_ENABLED:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Persist UserRole/UserStatus as their numeric code, not as the enum name.
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto

tokenx:
  activity-cache:
    namespace: ${TOKENX_ACTIVITY_CACHE_NAMESPACE:tokenx:activity:public:v1}
    positive-ttl-min: ${TOKENX_ACTIVITY_CACHE_POSITIVE_TTL_MIN:30s}
    positive-ttl-max: ${TOKENX_ACTIVITY_CACHE_POSITIVE_TTL_MAX:45s}
    negative-ttl-min: ${TOKENX_ACTIVITY_CACHE_NEGATIVE_TTL_MIN:5s}
    negative-ttl-max: ${TOKENX_ACTIVITY_CACHE_NEGATIVE_TTL_MAX:10s}
    max-concurrent-requests: ${TOKENX_ACTIVITY_CACHE_MAX_CONCURRENT:128}
    max-queued-requests: ${TOKENX_ACTIVITY_CACHE_MAX_QUEUED:64}
    ingress-wait: ${TOKENX_ACTIVITY_CACHE_INGRESS_WAIT:10ms}
    fallback-concurrency: ${TOKENX_ACTIVITY_CACHE_FALLBACK_CONCURRENCY:8}
    fallback-queue-capacity: ${TOKENX_ACTIVITY_CACHE_FALLBACK_QUEUE:8}
    fallback-wait: ${TOKENX_ACTIVITY_CACHE_FALLBACK_WAIT:20ms}
    redis-command-timeout: ${TOKENX_ACTIVITY_CACHE_REDIS_COMMAND_TIMEOUT:500ms}
    redis-connect-timeout: ${TOKENX_ACTIVITY_CACHE_REDIS_CONNECT_TIMEOUT:500ms}

  auth:
    jwt:
      # No default on purpose: supply TOKENX_JWT_SECRET, or put the value in the git-ignored
      # application-local.yml. The application refuses to start with a shorter key.
      secret: ${TOKENX_JWT_SECRET:}
      # Already-issued tokens stay valid until they expire; there is no revocation list in V1.
      ttl: ${TOKENX_JWT_TTL:1h}

  order:
    # How long a created order stays payable. Read once per creation and frozen into expires_at, so
    # changing it only affects new orders. Validated at startup: positive and at most 24h.
    payment-timeout: ${TOKENX_ORDER_PAYMENT_TIMEOUT:15m}

    # The scan that closes orders whose deadline passed unpaid. Production runs it; it can be
    # switched off for a maintenance window or for tests that drive the scan themselves.
    timeout:
      enabled: ${TOKENX_ORDER_TIMEOUT_ENABLED:true}
      # Delay between two runs, measured from the end of the previous one. Must be positive.
      interval: ${TOKENX_ORDER_TIMEOUT_INTERVAL:30s}
      # Order claims one run may make, failed attempts included: a budget of attempts, not a count
      # of closures. Bounded on purpose: each order is its own transaction, and an unbounded batch
      # would hold locks for an unbounded time. Must be 1..1000.
      max-orders-per-run: ${TOKENX_ORDER_TIMEOUT_MAX_ORDERS_PER_RUN:100}

  messaging:
    kafka-enabled: ${TOKENX_MESSAGING_KAFKA_ENABLED:true}
    listener-enabled: ${TOKENX_MESSAGING_LISTENER_ENABLED:true}
    outbox-enabled: ${TOKENX_MESSAGING_OUTBOX_ENABLED:true}
    order-events-topic: ${TOKENX_ORDER_EVENTS_TOPIC:tokenx.order-events.v1}
    order-events-dlt-topic: ${TOKENX_ORDER_EVENTS_DLT_TOPIC:tokenx.order-events.dlt.v1}
    consumer-group-id: ${TOKENX_ORDER_EVENTS_CONSUMER_GROUP:tokenx-order-events-v1}
    topic-partitions: ${TOKENX_ORDER_EVENTS_PARTITIONS:1}
    topic-replication-factor: ${TOKENX_ORDER_EVENTS_REPLICATION_FACTOR:1}
    listener-concurrency: ${TOKENX_ORDER_EVENTS_CONCURRENCY:1}
    outbox-batch-size: ${TOKENX_OUTBOX_BATCH_SIZE:25}
    outbox-max-attempts: ${TOKENX_OUTBOX_MAX_ATTEMPTS:5}
    outbox-poll-interval: ${TOKENX_OUTBOX_POLL_INTERVAL:1s}
    outbox-lease: ${TOKENX_OUTBOX_LEASE:90s}
    retry-base-delay: ${TOKENX_OUTBOX_RETRY_BASE_DELAY:1s}
    retry-max-delay: ${TOKENX_OUTBOX_RETRY_MAX_DELAY:30s}
    send-timeout: ${TOKENX_KAFKA_SEND_TIMEOUT:3s}
    listener-retry-delay: ${TOKENX_KAFKA_LISTENER_RETRY_DELAY:250ms}
    listener-retry-count: ${TOKENX_KAFKA_LISTENER_RETRY_COUNT:3}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info

spring:
  application:
    name: tokenx

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tokenx?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${TOKENX_DB_USERNAME:tokenx}
    # Never put a real password here: use application-local.yml (git-ignored) or the env var.
    password: ${TOKENX_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing, unmanaged database must never be baselined silently.
    baseline-on-migrate: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Persist UserRole/UserStatus as their numeric code, not as the enum name.
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto

tokenx:
  auth:
    jwt:
      # No default on purpose: supply TOKENX_JWT_SECRET, or put the value in the git-ignored
      # application-local.yml. The application refuses to start with a shorter key.
      secret: ${TOKENX_JWT_SECRET:}
      # Already-issued tokens stay valid until they expire; there is no revocation list in V1.
      ttl: ${TOKENX_JWT_TTL:1h}

  order:
    # How long a created order stays payable. Read once per creation and frozen into expires_at, so
    # changing it only affects new orders. Validated at startup: positive and at most 24h.
    payment-timeout: ${TOKENX_ORDER_PAYMENT_TIMEOUT:15m}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
